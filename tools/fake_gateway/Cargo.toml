[package]
name = "hermes-fake-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "hermes_fake_gateway"
path = "src/lib.rs"

[[bin]]
name = "hermes-fake-gateway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "signal"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = "0.3"
serde_json = "1"
percent-encoding = "2"
parking_lot = "0.12"

[dev-dependencies]
hermes_core = { path = "../../hermes_core" }
