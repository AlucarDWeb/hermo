[package]
name = "hermes_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "hermes_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
uniffi = { version = "0.31", features = ["cli", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls-webpki-roots"] }
reqwest_cookie_store = "0.8"
cookie_store = { version = "0.21", features = ["serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = "2"
parking_lot = "0.12"
percent-encoding = "2"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "hermes-probe"
path = "src/bin/hermes-probe.rs"